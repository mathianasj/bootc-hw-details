---
# Build live bootc ISO → Redfish virtual media → boot → scrape SOL for hw-gather.
#
# The ISO is a live environment (dmsquash-live). It does NOT install to disk.
# Live ISO is built by scripts/build-live-iso.sh (iso_builder_mode=script).
# Optional: iso_builder_mode=host|container for osbuild image-builder.
#
#   ansible-galaxy collection install -r requirements.yml
#   export REDFISH_PASSWORD='...'
#   ansible-playbook -i inventory.yml playbook.yml \
#     -e redfish_address='https://192.168.100.1:8000/redfish/v1/Systems/<uuid>' \
#     -e redfish_username=admin

- name: bootc-hw-gather via Redfish virtual media + SOL
  hosts: localhost
  connection: local
  gather_facts: true

  vars:
    repo_root: "{{ playbook_dir | dirname }}"
    output_dir: "{{ repo_root }}/output"
    iso_dir: "{{ output_dir }}/iso"
    iso_build_dir: "{{ output_dir }}/iso-build"
    capture_dir: "{{ output_dir }}/captures/{{ redfish_address | default('bmc') }}"
    image_name: "localhost/bootc-hw-gather:latest"
    # Unsigned rewrite for osbuild modes only
    image_name_osbuild: "localhost/bootc-hw-gather:osbuild"
    # script = repo live-ISO script (default); host|container = image-builder
    iso_builder_mode: script
    live_iso_script: "{{ repo_root }}/scripts/build-live-iso.sh"
    image_builder_cmd: "sudo image-builder"
    image_builder_image: "ghcr.io/osbuild/image-builder-cli:latest"
    # Install image-builder on localhost when missing (host mode only)
    install_image_builder: true
    # COPR chroot override; empty = epel-N on RHEL (rhel-N osbuild COPR is empty)
    image_builder_copr_chroot: ""
    bootc_default_fs: ext4
    # Optional buildroot with ISO tools; empty = use image_name (ships the tools)
    bootc_build_ref: ""
    skip_build: false

    # Host, host:port, or a full Systems URL:
    # https://192.168.100.1:8000/redfish/v1/Systems/<uuid>
    redfish_address: ""
    redfish_baseuri: ""
    redfish_bmc_host: ""
    redfish_username: ""
    redfish_password: "{{ lookup('env', 'REDFISH_PASSWORD') }}"
    redfish_validate_certs: false
    redfish_vm_category: "Manager"
    redfish_vm_resource_id: ""
    redfish_system_id: ""
    redfish_bootdevice: "Cd"

    ipmi_username: "{{ redfish_username }}"
    ipmi_password: "{{ redfish_password }}"
    ipmi_port: 623
    # Serial scrape transport: auto (ipmi then redfish; default), ipmi, or
    # redfish (SSH/websocket). Many BMCs expose IPMI but leave SOL payload
    # disabled / unsupported — auto falls through to Redfish serial.
    sol_transport: auto

    iso_http_bind: "0.0.0.0"
    iso_http_port: 8080
    iso_http_host: "{{ ansible_default_ipv4.address | default(ansible_host) }}"
    iso_filename: "bootc-hw-gather.iso"

    # Live ISO build needs rootful podman + host container storage
    podman_cmd: "sudo podman"

    # Live boot + LLDP wait (45s) + gather; VirtualBMC SOL is slow
    sol_timeout_seconds: 420
    post_reboot_settle_seconds: 45
    sol_capture_script: "{{ playbook_dir }}/scripts/sol_capture.py"

    _http_pid_file: "{{ output_dir }}/.iso-http.pid"

  pre_tasks:
    - name: Validate required variables
      ansible.builtin.assert:
        that:
          - redfish_address | length > 0
          - redfish_username | length > 0
          - redfish_password | length > 0
        fail_msg: >-
          Set redfish_address, redfish_username, and REDFISH_PASSWORD
          (or redfish_password). This live ISO does not install to disk.

    - name: Split a full Redfish Systems URL into host:port and system id
      ansible.builtin.set_fact:
        redfish_baseuri: >-
          {{
            (redfish_address | urlsplit('hostname'))
            ~ (
              ':' ~ (redfish_address | urlsplit('port') | string)
              if (redfish_address | urlsplit('port'))
              else ''
            )
          }}
        redfish_bmc_host: "{{ redfish_address | urlsplit('hostname') }}"
        redfish_system_id: >-
          {{
            redfish_system_id
            if (redfish_system_id | default('') | length) > 0
            else (
              (redfish_address | urlsplit('path')).rstrip('/').split('/') | last
              if '/Systems/' in (redfish_address | urlsplit('path'))
              else ''
            )
          }}
      when: redfish_address is match('^https?://')

    - name: Use host or host:port when redfish_address is not a URL
      ansible.builtin.set_fact:
        redfish_baseuri: "{{ redfish_address }}"
        redfish_bmc_host: "{{ redfish_address.split(':') | first }}"
      when: redfish_baseuri | length == 0

    - name: Show resolved Redfish target
      ansible.builtin.debug:
        msg:
          - "baseuri: {{ redfish_baseuri }}"
          - "system id: {{ redfish_system_id | default('(default system)') }}"
          - "SOL host: {{ redfish_bmc_host }}"

    - name: Set capture directory from BMC host
      ansible.builtin.set_fact:
        capture_dir: "{{ output_dir }}/captures/{{ redfish_bmc_host }}"

    - name: Ensure output directories exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ output_dir }}"
        - "{{ iso_dir }}"
        - "{{ capture_dir }}"

  tasks:
    # ------------------------------------------------------------------ build
    # RHUI AMIs often ship manage_repos=0 (no redhat.repo). After the operator
    # runs `subscription-manager register`, prepare CDN repos for the bind-mounted
    # Containerfile build. Skip when a manual CDN repo is already present.
    - name: Check for manual CDN repo override
      ansible.builtin.stat:
        path: /etc/yum.repos.d/rhel9-cdn-manual.repo
      register: cdn_manual_repo
      when: not skip_build | bool
      tags: [build]

    - name: Require subscription-manager registration on the build host
      ansible.builtin.command:
        cmd: sudo subscription-manager identity
      register: rhsm_identity
      changed_when: false
      failed_when: false
      when:
        - not skip_build | bool
        - not (cdn_manual_repo.stat.exists | default(false))
      tags: [build]

    - name: Fail when build host is not registered with Red Hat
      ansible.builtin.fail:
        msg: >-
          Build host is not registered (subscription-manager identity failed).
          Register first (AMI RHUI ≠ CDN): subscription-manager register
          --org=… --activationkey=… (or --username=… --auto-attach), then
          re-run. Or place /etc/yum.repos.d/rhel9-cdn-manual.repo — see README
          "AWS RHEL AMI (EC2) build host".
      when:
        - not skip_build | bool
        - not (cdn_manual_repo.stat.exists | default(false))
        - rhsm_identity.rc | default(1) != 0
      tags: [build]

    - name: Disable RHUI repos so CDN is preferred for the image build
      ansible.builtin.command:
        cmd: sudo dnf config-manager --disable '*rhui*'
      when:
        - not skip_build | bool
        - not (cdn_manual_repo.stat.exists | default(false))
      failed_when: false
      changed_when: true
      tags: [build]

    - name: Enable RHSM-managed redhat.repo on RHUI AMIs
      ansible.builtin.command:
        cmd: sudo subscription-manager config --rhsm.manage_repos=1
      when:
        - not skip_build | bool
        - not (cdn_manual_repo.stat.exists | default(false))
      changed_when: true
      tags: [build]

    - name: Refresh subscription-manager data
      ansible.builtin.command:
        cmd: sudo subscription-manager refresh
      when:
        - not skip_build | bool
        - not (cdn_manual_repo.stat.exists | default(false))
      changed_when: true
      tags: [build]

    - name: Enable CDN BaseOS and AppStream repos
      ansible.builtin.command:
        cmd: >-
          sudo subscription-manager repos
          --enable=rhel-9-for-x86_64-baseos-rpms
          --enable=rhel-9-for-x86_64-appstream-rpms
      when:
        - not skip_build | bool
        - not (cdn_manual_repo.stat.exists | default(false))
      changed_when: true
      tags: [build]

    - name: Verify CDN repo file for bind-mounted build
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /etc/yum.repos.d/redhat.repo
        - /etc/yum.repos.d/rhel9-cdn-manual.repo
      register: cdn_repo_files
      when: not skip_build | bool
      tags: [build]

    - name: Fail when no CDN repo file is available for the container build
      ansible.builtin.fail:
        msg: >-
          Neither /etc/yum.repos.d/redhat.repo nor rhel9-cdn-manual.repo
          exists. The Containerfile needs one of them (Unknown repo:
          rhel-9-for-x86_64-baseos-rpms). After register, ensure
          manage_repos=1 + refresh succeeded, or create the manual CDN
          repo — see README "AWS RHEL AMI (EC2) build host".
      when:
        - not skip_build | bool
        - (cdn_repo_files.results | selectattr('stat.exists') | list | length) == 0
      tags: [build]

    - name: Build bootc container image (live-capable)
      ansible.builtin.command:
        cmd: >-
          {{ podman_cmd }} build
          --cap-add sys_admin
          --security-opt label=disable
          -v /etc/pki/entitlement:/etc/pki/entitlement:ro
          -v /etc/pki/consumer:/etc/pki/consumer:ro
          -v /etc/rhsm:/etc/rhsm:ro
          -v /etc/yum.repos.d:/etc/yum.repos.d:ro
          -t {{ image_name }}
          {{ repo_root }}
      when: not skip_build | bool
      tags: [build]

    - name: Ensure ISO build output directory exists
      ansible.builtin.file:
        path: "{{ iso_build_dir }}"
        state: directory
        mode: "0755"
      when: not skip_build | bool
      tags: [build]

    - name: Install live ISO host tools (script mode)
      ansible.builtin.command:
        cmd: >-
          sudo dnf install -y squashfs-tools xorriso isomd5sum
          grub2-tools grub2-pc-modules dosfstools
      when:
        - not skip_build | bool
        - iso_builder_mode | default('script') == 'script'
      tags: [build]
      changed_when: true

    - name: Build live ISO with scripts/build-live-iso.sh
      ansible.builtin.command:
        argv:
          - sudo
          - "{{ live_iso_script }}"
          - --image
          - "{{ image_name }}"
          - --output
          - "{{ iso_dir }}/{{ iso_filename }}"
          - --workdir
          - "{{ iso_build_dir }}"
      when:
        - not skip_build | bool
        - iso_builder_mode | default('script') == 'script'
      tags: [build]

    - name: Check for image-builder CLI when iso_builder_mode=host
      ansible.builtin.command:
        cmd: bash -c "command -v image-builder"
      register: image_builder_which
      changed_when: false
      failed_when: false
      when:
        - not skip_build | bool
        - iso_builder_mode | default('script') == 'host'
      tags: [build]

    - name: Derive COPR chroot for image-builder install
      ansible.builtin.set_fact:
        # @osbuild/osbuild has no packages in rhel-9 (0 builds); use epel-9 there.
        # image-builder is published for both rhel-9 and epel-9.
        _image_builder_copr_chroot: >-
          {{
            image_builder_copr_chroot
            if (image_builder_copr_chroot | default('') | length) > 0
            else (
              'epel-' ~ ansible_distribution_major_version ~ '-' ~ ansible_architecture
              if ansible_distribution in ['RedHat', 'Rocky', 'AlmaLinux']
              else (
                'centos-stream-' ~ ansible_distribution_major_version ~ '-' ~ ansible_architecture
                if ansible_distribution == 'CentOS'
                else (
                  (ansible_distribution | lower)
                  ~ '-' ~ ansible_distribution_major_version
                  ~ '-' ~ ansible_architecture
                )
              )
            )
          }}
      when:
        - not skip_build | bool
        - iso_builder_mode | default('script') == 'host'
        - image_builder_which.rc | default(1) != 0
        - install_image_builder | default(true) | bool
      tags: [build]

    - name: Install dnf-plugins-core for COPR
      ansible.builtin.command:
        cmd: sudo dnf install -y dnf-plugins-core
      when:
        - not skip_build | bool
        - iso_builder_mode | default('script') == 'host'
        - image_builder_which.rc | default(1) != 0
        - install_image_builder | default(true) | bool
        - ansible_os_family == 'RedHat'
      tags: [build]
      changed_when: true

    - name: Drop stale osbuild COPR repos (e.g. empty rhel-9)
      ansible.builtin.command:
        cmd: sudo dnf -y copr remove @osbuild/{{ item }}
      loop:
        - osbuild
        - image-builder
      when:
        - not skip_build | bool
        - iso_builder_mode | default('script') == 'host'
        - image_builder_which.rc | default(1) != 0
        - install_image_builder | default(true) | bool
        - ansible_distribution in ['RedHat', 'CentOS', 'Rocky', 'AlmaLinux']
      failed_when: false
      tags: [build]
      changed_when: true

    - name: Enable osbuild COPRs on RHEL-like hosts
      ansible.builtin.command:
        cmd: >-
          sudo dnf -y copr enable @osbuild/{{ item }}
          {{ _image_builder_copr_chroot }}
      loop:
        - osbuild
        - image-builder
      when:
        - not skip_build | bool
        - iso_builder_mode | default('script') == 'host'
        - image_builder_which.rc | default(1) != 0
        - install_image_builder | default(true) | bool
        - ansible_distribution in ['RedHat', 'CentOS', 'Rocky', 'AlmaLinux']
      tags: [build]
      changed_when: true

    - name: Install image-builder and osbuild deps on localhost
      ansible.builtin.command:
        cmd: >-
          sudo dnf install -y image-builder
          osbuild osbuild-depsolve-dnf osbuild-luks2 osbuild-lvm2 osbuild-ostree
      when:
        - not skip_build | bool
        - iso_builder_mode | default('script') == 'host'
        - image_builder_which.rc | default(1) != 0
        - install_image_builder | default(true) | bool
      tags: [build]
      changed_when: true

    - name: Re-check image-builder CLI after install
      ansible.builtin.command:
        cmd: bash -c "command -v image-builder"
      register: image_builder_which
      changed_when: false
      when:
        - not skip_build | bool
        - iso_builder_mode | default('script') == 'host'
        - install_image_builder | default(true) | bool
      tags: [build]

    - name: Fail if image-builder is still missing
      ansible.builtin.fail:
        msg: >-
          image-builder not found after install attempt. Fix dnf/COPR access on
          this host, set image_builder_copr_chroot explicitly, set
          install_image_builder=false and install manually, or use
          iso_builder_mode=container with a pullable image_builder_image.
      when:
        - not skip_build | bool
        - iso_builder_mode | default('script') == 'host'
        - image_builder_which.rc | default(1) != 0
      tags: [build]

    - name: Ensure skopeo is available for unsigned image rewrite
      ansible.builtin.command:
        cmd: sudo dnf install -y skopeo
      when:
        - not skip_build | bool
        - iso_builder_mode | default('script') in ['host', 'container']
      tags: [build]
      changed_when: true
      failed_when: false

    - name: Rematerialize bootc image without signatures for osbuild
      ansible.builtin.shell: |
        set -euo pipefail
        # osbuild container-deploy often fails with "layer not known" on signed
        # RHEL bootc images; rewrite to an unsigned tag in root storage.
        {{ podman_cmd }} image exists "{{ image_name }}"
        {{ podman_cmd }} rmi -f "{{ image_name_osbuild }}" 2>/dev/null || true
        if command -v skopeo >/dev/null 2>&1 || command -v /usr/bin/skopeo >/dev/null 2>&1; then
          sudo skopeo copy --remove-signatures \
            "containers-storage:{{ image_name }}" \
            "containers-storage:{{ image_name_osbuild }}"
        else
          archive="{{ output_dir }}/.bootc-osbuild.oci.tar"
          rm -f "$archive"
          {{ podman_cmd }} save --format oci-archive -o "$archive" "{{ image_name }}"
          {{ podman_cmd }} load -i "$archive"
          {{ podman_cmd }} tag "{{ image_name }}" "{{ image_name_osbuild }}"
          rm -f "$archive"
        fi
        cid=$({{ podman_cmd }} create "{{ image_name_osbuild }}")
        {{ podman_cmd }} mount "$cid" >/dev/null
        {{ podman_cmd }} umount "$cid"
        {{ podman_cmd }} rm "$cid"
      args:
        executable: /bin/bash
      when:
        - not skip_build | bool
        - iso_builder_mode | default('script') in ['host', 'container']
      tags: [build]
      changed_when: true

    - name: Assemble image-builder arguments (host paths)
      ansible.builtin.set_fact:
        _ib_build_args: "{{
            ['build', '--bootc-ref', image_name_osbuild]
            + (
              ['--bootc-build-ref', bootc_build_ref]
              if (bootc_build_ref | default('') | length) > 0
              else []
            )
            + [
              '--bootc-default-fs', bootc_default_fs,
              '--output-dir', iso_build_dir,
              '--output-name', (iso_filename | regex_replace('\\.iso$', '')),
              'bootc-generic-iso'
            ]
          }}"
      when:
        - not skip_build | bool
        - iso_builder_mode | default('script') == 'host'
      tags: [build]

    - name: Assemble image-builder arguments (container paths)
      ansible.builtin.set_fact:
        _ib_build_args: "{{
            ['build', '--bootc-ref', image_name_osbuild]
            + (
              ['--bootc-build-ref', bootc_build_ref]
              if (bootc_build_ref | default('') | length) > 0
              else []
            )
            + [
              '--bootc-default-fs', bootc_default_fs,
              '--output-dir', '/output',
              '--output-name', (iso_filename | regex_replace('\\.iso$', '')),
              'bootc-generic-iso'
            ]
          }}"
      when:
        - not skip_build | bool
        - iso_builder_mode | default('script') == 'container'
      tags: [build]

    - name: Build live ISO with image-builder (bootc-generic-iso, host)
      ansible.builtin.command:
        argv: "{{ image_builder_cmd.split() + _ib_build_args }}"
      when:
        - not skip_build | bool
        - iso_builder_mode | default('script') == 'host'
      tags: [build]

    - name: Build live ISO with image-builder (bootc-generic-iso, container)
      ansible.builtin.command:
        argv: "{{
            podman_cmd.split()
            + [
              'run', '--rm', '--privileged',
              '--security-opt', 'label=disable',
              '-v', iso_build_dir ~ ':/output',
              '-v', '/var/lib/containers/storage:/var/lib/containers/storage',
              image_builder_image
            ]
            + _ib_build_args
          }}"
      when:
        - not skip_build | bool
        - iso_builder_mode | default('script') == 'container'
      tags: [build]

    - name: Locate built ISO
      ansible.builtin.find:
        paths:
          - "{{ iso_build_dir }}"
          - "{{ output_dir }}"
          - "{{ iso_dir }}"
        patterns:
          - "*.iso"
        recurse: true
      register: iso_find
      tags: [build, deploy]

    - name: Fail if no ISO found
      ansible.builtin.assert:
        that:
          - iso_find.files | length > 0
        fail_msg: >-
          No .iso found under {{ output_dir }}. Build first (omit skip_build)
          or place an ISO there.
      tags: [build, deploy]

    - name: Pick newest ISO and stage under iso/
      ansible.builtin.copy:
        src: "{{ (iso_find.files | sort(attribute='mtime') | last).path }}"
        dest: "{{ iso_dir }}/{{ iso_filename }}"
        remote_src: true
        mode: "0644"
      tags: [build, deploy]

    - name: Set ISO URL for BMC
      ansible.builtin.set_fact:
        iso_image_url: "http://{{ iso_http_host }}:{{ iso_http_port }}/{{ iso_filename }}"
        # community.general baseuri is host[:port]; uri tasks need a scheme.
        redfish_url_root: "https://{{ redfish_baseuri }}"
      tags: [deploy]

    # sushy-emulator uses the same UUID for System and Manager; if the user only
    # passed redfish_vm_resource_id, reuse it as the Systems Id for VM ops.
    - name: Default redfish_system_id from virtual-media resource_id when unset
      ansible.builtin.set_fact:
        redfish_system_id: "{{ redfish_vm_resource_id }}"
      when:
        - (redfish_system_id | default('') | length) == 0
        - (redfish_vm_resource_id | default('') | length) > 0
      tags: [deploy]

    - name: Show ISO URL the BMC will fetch
      ansible.builtin.debug:
        msg: >-
          Serving {{ iso_dir }}/{{ iso_filename }} as {{ iso_image_url }}
          (sushy-emulator downloads this on the hypervisor — prefer
          -e iso_http_host=127.0.0.1 when the emulator is local)
      tags: [deploy]

    # ----------------------------------------------------------- HTTP server
    - name: Stop any previous ISO HTTP server
      ansible.builtin.shell: |
        set -e
        if [ -f "{{ _http_pid_file }}" ]; then
          kill "$(cat "{{ _http_pid_file }}")" 2>/dev/null || true
          rm -f "{{ _http_pid_file }}"
        fi
      args:
        executable: /bin/bash
      tags: [deploy]
      changed_when: true

    - name: Start HTTP server for virtual media ISO
      ansible.builtin.shell: |
        set -e
        cd "{{ iso_dir }}"
        nohup python3 -m http.server {{ iso_http_port }} --bind {{ iso_http_bind }} \
          >"{{ output_dir }}/iso-http.log" 2>&1 &
        echo $! >"{{ _http_pid_file }}"
        sleep 1
        kill -0 "$(cat "{{ _http_pid_file }}")"
      args:
        executable: /bin/bash
      tags: [deploy]
      changed_when: true

    # -------------------------------------------------------------- Redfish
    - name: Build common Redfish auth args
      ansible.builtin.set_fact:
        redfish_auth:
          baseuri: "{{ redfish_baseuri }}"
          username: "{{ redfish_username }}"
          password: "{{ redfish_password }}"
      tags: [deploy]

    - name: Discover Redfish Managers when virtual-media resource_id is unset
      community.general.redfish_info:
        category: Manager
        command: GetManagerInventory
        baseuri: "{{ redfish_auth.baseuri }}"
        username: "{{ redfish_auth.username }}"
        password: "{{ redfish_auth.password }}"
        validate_certs: "{{ redfish_validate_certs }}"
      register: redfish_managers
      when:
        - (redfish_vm_resource_id | default('') | length) == 0
        - redfish_vm_category | default('Manager') == 'Manager'
      tags: [deploy]

    - name: Collect Manager Ids from inventory
      ansible.builtin.set_fact:
        _mgr_ids: >-
          {{
            redfish_managers.redfish_facts.manager.entries
            | default([])
            | map('last')
            | selectattr('Id', 'defined')
            | map(attribute='Id')
            | list
          }}
      when:
        - (redfish_vm_resource_id | default('') | length) == 0
        - redfish_vm_category | default('Manager') == 'Manager'
        - redfish_managers is defined
        - not (redfish_managers.failed | default(false))
        - redfish_managers.redfish_facts is defined
        - redfish_managers.redfish_facts.manager is defined
      tags: [deploy]

    - name: Use sole Manager Id for virtual media
      ansible.builtin.set_fact:
        redfish_vm_resource_id: "{{ _mgr_ids | first }}"
      when:
        - (redfish_vm_resource_id | default('') | length) == 0
        - (_mgr_ids | default([]) | length) == 1
      tags: [deploy]

    - name: Prefer Manager Id matching the Systems UUID when several exist
      ansible.builtin.set_fact:
        redfish_vm_resource_id: "{{ redfish_system_id }}"
      when:
        - (redfish_vm_resource_id | default('') | length) == 0
        - (_mgr_ids | default([]) | length) > 1
        - (redfish_system_id | default('') | length) > 0
        - redfish_system_id in (_mgr_ids | default([]))
      tags: [deploy]

    - name: Prefer a BMC-like Manager Id when several exist
      ansible.builtin.set_fact:
        redfish_vm_resource_id: "{{ _preferred_mgr | first }}"
      vars:
        _preferred_mgr: >-
          {{
            _mgr_ids
            | default([])
            | select('match', '(?i)^(BMC|iDRAC|1|Manager\\.Embedded\\.1|iDRAC\\.Embedded\\.1)$')
            | list
          }}
      when:
        - (redfish_vm_resource_id | default('') | length) == 0
        - (_mgr_ids | default([]) | length) > 1
        - (_preferred_mgr | length) > 0
      tags: [deploy]

    - name: Fail if Manager resource_id cannot be determined
      ansible.builtin.fail:
        msg: >-
          Multiple (or zero) Redfish Managers found and redfish_vm_resource_id
          is unset. Set -e redfish_vm_resource_id=<Id> (examples: BMC, 1,
          iDRAC.Embedded.1, or the Systems UUID). Discovered Ids:
          {{ _mgr_ids | default([]) }}.
      when:
        - redfish_vm_category | default('Manager') == 'Manager'
        - (redfish_vm_resource_id | default('') | length) == 0
      tags: [deploy]

    - name: Show Redfish virtual-media Manager target
      ansible.builtin.debug:
        msg: "Virtual media Manager resource_id={{ redfish_vm_resource_id }}"
      tags: [deploy]

    # community.general VirtualMediaInsert only uses a slot when Inserted=false
    # AND ImageName is empty. sushy-emulator often leaves ImageName set after
    # eject, which yields: "Unable to find an available VirtualMedia resource
    # supporting ['CD', 'DVD']". Drive Insert/Eject via the Cd action URIs
    # directly (Manager then Systems) — that matches sushy-tools docs.
    - name: Build VirtualMedia Cd action candidates
      ansible.builtin.set_fact:
        vm_cd_paths: >-
          {{
            [
              '/redfish/v1/Managers/' ~ redfish_vm_resource_id ~ '/VirtualMedia/Cd',
              '/redfish/v1/Systems/' ~ (redfish_system_id | default(redfish_vm_resource_id, true)) ~ '/VirtualMedia/Cd'
            ] | unique
          }}
      tags: [deploy]

    - name: Eject VirtualMedia Cd via Redfish action
      ansible.builtin.uri:
        url: "{{ redfish_url_root }}{{ item }}/Actions/VirtualMedia.EjectMedia"
        method: POST
        url_username: "{{ redfish_auth.username }}"
        url_password: "{{ redfish_auth.password }}"
        force_basic_auth: true
        validate_certs: "{{ redfish_validate_certs }}"
        status_code: [200, 202, 204, 400, 404]
        headers:
          Content-Type: application/json
        body_format: json
        body: {}
      loop: "{{ vm_cd_paths }}"
      register: vm_eject_uri
      failed_when: false
      tags: [deploy]

    - name: Insert VirtualMedia Cd via Redfish action
      ansible.builtin.uri:
        url: "{{ redfish_url_root }}{{ item }}/Actions/VirtualMedia.InsertMedia"
        method: POST
        url_username: "{{ redfish_auth.username }}"
        url_password: "{{ redfish_auth.password }}"
        force_basic_auth: true
        validate_certs: "{{ redfish_validate_certs }}"
        status_code: [200, 202, 204]
        headers:
          Content-Type: application/json
        body_format: json
        body:
          Image: "{{ iso_image_url }}"
          Inserted: true
      loop: "{{ vm_cd_paths }}"
      register: vm_insert_uri
      failed_when: false
      tags: [deploy]

    - name: Read VirtualMedia Cd state after insert
      ansible.builtin.uri:
        url: "{{ redfish_url_root }}{{ item }}"
        method: GET
        url_username: "{{ redfish_auth.username }}"
        url_password: "{{ redfish_auth.password }}"
        force_basic_auth: true
        validate_certs: "{{ redfish_validate_certs }}"
        status_code: [200, 404]
      loop: "{{ vm_cd_paths }}"
      register: vm_cd_state
      failed_when: false
      tags: [deploy]

    - name: Decide whether VirtualMedia Cd shows our ISO
      ansible.builtin.set_fact:
        vm_iso_inserted: >-
          {{
            vm_cd_state.results
            | default([])
            | selectattr('status', 'defined')
            | selectattr('status', 'equalto', 200)
            | selectattr('json', 'defined')
            | map(attribute='json')
            | selectattr('Inserted', 'defined')
            | selectattr('Inserted')
            | selectattr('Image', 'defined')
            | map(attribute='Image')
            | select('search', iso_filename)
            | list
            | length > 0
          }}
        vm_cd_debug: >-
          {{
            vm_cd_state.results
            | default([])
            | selectattr('json', 'defined')
            | map(attribute='json')
            | list
          }}
      tags: [deploy]

    - name: Show VirtualMedia Cd state
      ansible.builtin.debug:
        msg:
          - "iso_image_url={{ iso_image_url }}"
          - "vm_iso_inserted={{ vm_iso_inserted }}"
          - "cd={{ vm_cd_debug | to_nice_json }}"
          - "insert_statuses={{ vm_insert_uri.results | default([]) | map(attribute='status') | list }}"
      tags: [deploy]

    - name: Fail when VirtualMedia Cd does not show the live ISO inserted
      ansible.builtin.fail:
        msg: >-
          Could not insert {{ iso_filename }} via Redfish VirtualMedia.Cd.
          URL was {{ iso_image_url }}. For sushy-emulator on this hypervisor,
          re-run with -e iso_http_host=127.0.0.1 and confirm
          curl -I {{ iso_image_url }} works. Check sushy-emulator logs if
          InsertMedia returns 4xx. Cd state: {{ vm_cd_debug }}.
      when: not (vm_iso_inserted | bool)
      tags: [deploy]

    - name: Set one-time boot to CD (virtual media)
      community.general.redfish_command:
        category: Systems
        command: SetOneTimeBoot
        bootdevice: "{{ redfish_bootdevice }}"
        baseuri: "{{ redfish_auth.baseuri }}"
        username: "{{ redfish_auth.username }}"
        password: "{{ redfish_auth.password }}"
        validate_certs: "{{ redfish_validate_certs }}"
        resource_id: "{{ redfish_system_id | default(omit, true) }}"
      tags: [deploy]

    # ----------------------------------------------------------- SOL capture
    # Attach SOL *before* PowerOn. Activating after settle only catches an idle
    # login prompt (sol-raw.log stuck at "SOL Session operational").
    - name: Ensure ipmitool is installed for IPMI SOL capture
      ansible.builtin.command:
        cmd: sudo dnf install -y ipmitool
      when:
        - ansible_os_family == 'RedHat'
        - sol_transport | default('auto') in ['ipmi', 'auto']
      tags: [capture]
      changed_when: true

    - name: Ensure SSH tools for Redfish serial capture
      ansible.builtin.command:
        cmd: sudo dnf install -y openssh-clients sshpass
      when:
        - ansible_os_family == 'RedHat'
        - sol_transport | default('auto') in ['redfish', 'auto']
      tags: [capture]
      changed_when: true
      failed_when: false

    # sushy-emulator InsertMedia updates the *inactive* libvirt domain XML
    # (defineXML). PowerCycle / soft reset keeps the live CDROM empty, so the
    # guest never sees the ISO. Always ForceOff then PowerOn so start loads
    # inactive config with the virtual CD source attached.
    - name: Force power off so next start loads InsertMedia CDROM
      community.general.redfish_command:
        category: Systems
        command: PowerForceOff
        baseuri: "{{ redfish_auth.baseuri }}"
        username: "{{ redfish_auth.username }}"
        password: "{{ redfish_auth.password }}"
        validate_certs: "{{ redfish_validate_certs }}"
        resource_id: "{{ redfish_system_id | default(omit, true) }}"
      failed_when: false
      tags: [deploy]

    - name: Wait for domain to stop after ForceOff
      ansible.builtin.pause:
        seconds: 10
      tags: [deploy]

    # VirtualBMC binds SOL to the qemu serial PTY. Activating while the domain
    # is Off leaves a dead session after PowerOn (sol-raw.log stuck at
    # "SOL Session operational" with no guest bytes). Power on first, then
    # attach SOL immediately and scrape through GRUB/kernel.
    - name: Power on system to boot live ISO
      community.general.redfish_command:
        category: Systems
        command: PowerOn
        baseuri: "{{ redfish_auth.baseuri }}"
        username: "{{ redfish_auth.username }}"
        password: "{{ redfish_auth.password }}"
        validate_certs: "{{ redfish_validate_certs }}"
        resource_id: "{{ redfish_system_id | default(omit, true) }}"
      tags: [deploy]

    - name: Brief pause for qemu serial PTY after PowerOn
      ansible.builtin.pause:
        seconds: 2
      tags: [deploy, capture]

    - name: Start serial capture after PowerOn
      ansible.builtin.command:
        argv:
          - python3
          - "{{ sol_capture_script }}"
          - --transport
          - "{{ sol_transport | default('auto') }}"
          - --host
          - "{{ redfish_bmc_host }}"
          - --username
          - "{{ ipmi_username }}"
          - --password
          - "{{ ipmi_password }}"
          - --redfish-baseuri
          - "{{ redfish_baseuri }}"
          - --redfish-system-id
          - "{{ redfish_system_id | default('') }}"
          - --redfish-manager-id
          - "{{ redfish_vm_resource_id | default('') }}"
          - --port
          - "{{ ipmi_port | string }}"
          - --timeout
          - "{{ sol_timeout_seconds | string }}"
          - --output
          - "{{ capture_dir }}/sol-raw.log"
          - --report
          - "{{ capture_dir }}/hw-gather-report.txt"
          - --verbose
      async: "{{ (sol_timeout_seconds | int) + 120 }}"
      poll: 0
      register: sol_async
      environment:
        IPMI_PASSWORD: "{{ ipmi_password }}"
        REDFISH_PASSWORD: "{{ redfish_password }}"
      tags: [capture]

    - name: Wait for serial capture until hw-gather markers
      ansible.builtin.async_status:
        jid: "{{ sol_async.ansible_job_id }}"
      register: sol_capture
      until: sol_capture.finished
      retries: "{{ ((sol_timeout_seconds | int) / 10) | int + 6 }}"
      delay: 10
      when: sol_async.ansible_job_id is defined
      failed_when: false
      tags: [capture]

    - name: Read tail of SOL raw log
      ansible.builtin.command:
        cmd: "tail -n 200 {{ capture_dir }}/sol-raw.log"
      register: sol_raw_tail
      changed_when: false
      failed_when: false
      tags: [capture]

    - name: Show SOL capture stderr (script progress)
      ansible.builtin.debug:
        var: sol_capture.stderr_lines
      when: sol_capture is defined and (sol_capture.stderr_lines | default([]) | length) > 0
      tags: [capture]

    - name: Show SOL raw log (last 200 lines)
      ansible.builtin.debug:
        var: sol_raw_tail.stdout_lines
      tags: [capture]

    - name: Show parsed hw-gather report
      ansible.builtin.debug:
        var: sol_capture.stdout
      when:
        - sol_capture is defined
        - (sol_capture.rc | default(1) | int) == 0
      tags: [capture]

    - name: Confirm report files on control node
      ansible.builtin.debug:
        msg:
          - "Raw SOL log: {{ capture_dir }}/sol-raw.log"
          - "Parsed report: {{ capture_dir }}/hw-gather-report.txt"
      tags: [capture]

    - name: Fail when SOL capture did not find hw-gather markers
      ansible.builtin.fail:
        msg: >-
          SOL capture failed or timed out after {{ sol_timeout_seconds }}s
          (rc={{ sol_capture.rc | default('unset') }},
          finished={{ sol_capture.finished | default(false) }}).
          Full log: {{ capture_dir }}/sol-raw.log
      when: >
        sol_async.ansible_job_id is defined and (
          not (sol_capture.finished | default(false))
          or (sol_capture.rc | default(1) | int) != 0
        )
      tags: [capture]

  post_tasks:
    - name: Stop ISO HTTP server
      ansible.builtin.shell: |
        set -e
        if [ -f "{{ _http_pid_file }}" ]; then
          kill "$(cat "{{ _http_pid_file }}")" 2>/dev/null || true
          rm -f "{{ _http_pid_file }}"
        fi
      args:
        executable: /bin/bash
      tags: [always]
      changed_when: true
      failed_when: false

    - name: Optionally eject virtual media
      community.general.redfish_command:
        category: "{{ redfish_vm_category }}"
        command: VirtualMediaEject
        baseuri: "{{ redfish_baseuri }}"
        username: "{{ redfish_username }}"
        password: "{{ redfish_password }}"
        resource_id: "{{ redfish_vm_resource_id | default(omit, true) }}"
      when: eject_virtual_media | default(true) | bool
      failed_when: false
      tags: [always]
