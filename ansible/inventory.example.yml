---
# Copy to inventory.yml and fill in BMC details.
all:
  hosts:
    localhost:
      ansible_connection: local
      ansible_python_interpreter: "{{ ansible_playbook_python }}"
  vars:
    # BMC / Redfish. Host, host:port, or a full Systems URL.
    redfish_address: "https://192.168.100.1:8000/redfish/v1/Systems/93134133-30a3-4950-9a79-4233016ceb0a"
    redfish_username: "admin"
    redfish_password: "{{ lookup('env', 'REDFISH_PASSWORD') }}"
    # Optional: override if IPMI SOL uses different creds (defaults to Redfish)
    # ipmi_username: "admin"
    # ipmi_password: "{{ lookup('env', 'IPMI_PASSWORD') }}"

    # Image / live ISO build (does not install to disk)
    image_name: "localhost/bootc-hw-gather:latest"
    # script = scripts/build-live-iso.sh (default); host|container = image-builder
    iso_builder_mode: script
    # image_name_osbuild: "localhost/bootc-hw-gather:osbuild"  # host/container modes
    # image_builder_cmd: "sudo image-builder"
    # install_image_builder: true
    # image_builder_copr_chroot: "epel-9-x86_64"
    # image_builder_image: "ghcr.io/osbuild/image-builder-cli:latest"
    podman_cmd: "sudo podman"
    skip_build: false

    # HTTP serve for VirtualMediaInsert. The *emulator/BMC process* must be
    # able to download this URL (sushy-emulator fetches it on the hypervisor).
    # iso_http_bind: "0.0.0.0"
    # iso_http_port: 8080
    # Same host as sushy-emulator — prefer loopback so the download always works:
    # iso_http_host: "127.0.0.1"
    # Remote BMC: use an address the BMC can route to:
    # iso_http_host: "{{ ansible_default_ipv4.address }}"

    # Redfish virtual media (vendor-dependent)
    redfish_vm_category: "Manager"   # or Systems (playbook retries Systems if needed)
    # Required when the BMC has more than one Manager (playbook auto-picks
    # BMC/iDRAC/1 when possible; otherwise set explicitly):
    # redfish_vm_resource_id: "BMC"  # e.g. BMC, 1, iDRAC.Embedded.1, or Systems UUID
    # redfish_system_id: "1"

    # Timing (live boot — no Anaconda)
    sol_timeout_seconds: 900
    post_reboot_settle_seconds: 45
    # Serial scrape: auto (default; ipmi then redfish), ipmi, or redfish
    # sol_transport: auto
